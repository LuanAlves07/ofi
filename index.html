<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="description" content="Controle financeiro leve para sair das dívidas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OFI">
  <title>OFI</title>
  <meta property="og:title" content="OFI — Organização Financeira">
  <meta property="og:description" content="Organização financeira simples: quanto você pode gastar hoje e um plano claro para quitar as dívidas.">
  <meta property="og:image" content="icons/og.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><img src="img/ofi-avatar.png" alt="" width="30" height="30" style="border-radius:50%"><span id="appName">OFI</span></div>
      <button class="sync" id="syncStatus" data-act="sync-now" aria-label="Status da sincronização"></button>
    </header>
    <main id="app"></main>
  </div>

  <button class="fab" id="fab" data-act="add-open" aria-label="Adicionar gasto ou entrada"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="nav" id="nav">
    <button data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-tab="hist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Histórico</span></button>
    <button data-tab="debts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01"/></svg><span>Dívidas</span></button>
    <button data-tab="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Mais</span></button>
  </nav>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-act="sheet-close"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="chart-tip" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
